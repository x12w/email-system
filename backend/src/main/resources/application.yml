spring:
  application:
    name: email-system
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    secret: ${JWT_SECRET:replace-with-at-least-32-bytes-secret}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    root-path: ${STORAGE_LOCAL_ROOT_PATH:./data/uploads}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: ${MINIO_BUCKET:email-system}

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}

