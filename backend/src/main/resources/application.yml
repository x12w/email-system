spring:
  application:
    name: email-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:email_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:email_user}
    password: ${MYSQL_PASSWORD:email_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}

app:
  initial-admin:
    password: ${INIT_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  auth-rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    root-path: ${STORAGE_LOCAL_ROOT_PATH:./data/uploads}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: ${MINIO_BUCKET:email-system}

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  imap:
    fetch-count: ${IMAP_FETCH_COUNT:50}

intelligence:
  llm:
    enabled: ${INTELLIGENCE_LLM_ENABLED:true}
    base-url: ${INTELLIGENCE_LLM_BASE_URL:http://localhost:11434/v1}
    api-key: ${INTELLIGENCE_LLM_API_KEY:ollama}
    model: ${INTELLIGENCE_LLM_MODEL:qwen2.5:7b}
    timeout-seconds: ${INTELLIGENCE_LLM_TIMEOUT_SECONDS:30}
