spring:
  application:
    name: email-system
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /api

security:
  jwt:
    secret: ${JWT_SECRET:}
    expire-seconds: ${JWT_EXPIRE_SECONDS:7200}

app:
  initial-admin:
    password: ${INIT_ADMIN_PASSWORD:}
  auth-rate-limit:
    max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:5}
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}

storage:
  type: ${STORAGE_TYPE:local}
  local:
    root-path: ${STORAGE_LOCAL_ROOT_PATH:./data/uploads}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin123}
    bucket: ${MINIO_BUCKET:email-system}

mail:
  host: ${MAIL_HOST:localhost}
  port: ${MAIL_PORT:1025}
  imap:
    fetch-count: ${IMAP_FETCH_COUNT:50}

intelligence:
  plugin:
    enabled: ${INTELLIGENCE_PLUGIN_ENABLED:true}
    name: ${INTELLIGENCE_PLUGIN_NAME:python-mail-intelligence}
    version: ${INTELLIGENCE_PLUGIN_VERSION:0.1.0}
    artifact-path: ${INTELLIGENCE_PLUGIN_ARTIFACT_PATH:./plugins/intelligence/native/linux/libmail_intelligence.so}
    timeout-ms: ${INTELLIGENCE_PLUGIN_TIMEOUT_MS:2000}
