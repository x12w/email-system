services:
  mysql:
    image: mysql:8.4
    container_name: email-system-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-email_system}
      MYSQL_USER: ${MYSQL_USER:-email_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-email_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: email-system-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: email-system-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/uploads:/data
    command: server /data --console-address ":9001"

  mailpit:
    image: axllent/mailpit:v1.21.5
    container_name: email-system-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - ./data/mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  mailserver:
    image: docker.io/mailserver/docker-mailserver:15.0.0
    container_name: email-system-mailserver
    hostname: mail.x12w.com
    ports:
      - "25:25"
      - "993:993"
    volumes:
      - ./data/mailserver/mail-data:/var/mail
      - ./data/mailserver/mail-state:/var/mail-state
      - ./data/mailserver/config:/tmp/docker-mailserver
      - /etc/letsencrypt/live/panel.x12w.com/fullchain.pem:/etc/letsencrypt/live/panel.x12w.com/fullchain.pem:ro
      - /etc/letsencrypt/live/panel.x12w.com/privkey.pem:/etc/letsencrypt/live/panel.x12w.com/privkey.pem:ro
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /etc/letsencrypt/live/panel.x12w.com/fullchain.pem
      SSL_KEY_PATH: /etc/letsencrypt/live/panel.x12w.com/privkey.pem
      PERMIT_DOCKER: connected-networks
      ONE_DIR: 1
      ENABLE_IMAP: 1
      ENABLE_POP3: 0
      ENABLE_CLAMAV: 0
      ENABLE_RSPAMD: 0
      ENABLE_FAIL2BAN: 0
      ENABLE_POSTGREY: 0
      POSTMASTER_ADDRESS: admin@x12w.com
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE

  nginx:
    image: nginx:1.27-alpine
    container_name: email-system-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    profiles:
      - app

  backend:
    build:
      context: ./backend
    container_name: email-system-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-email_system}
      MYSQL_USER: ${MYSQL_USER:-email_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-email_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      STORAGE_LOCAL_ROOT_PATH: ${STORAGE_LOCAL_ROOT_PATH:-/app/data/uploads}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-email-system}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      INTELLIGENCE_PLUGIN_ENABLED: ${INTELLIGENCE_PLUGIN_ENABLED:-true}
      INTELLIGENCE_PLUGIN_NAME: ${INTELLIGENCE_PLUGIN_NAME:-python-mail-intelligence}
      INTELLIGENCE_PLUGIN_VERSION: ${INTELLIGENCE_PLUGIN_VERSION:-0.1.0}
      INTELLIGENCE_PLUGIN_ARTIFACT_PATH: ${INTELLIGENCE_PLUGIN_ARTIFACT_PATH:-./plugins/intelligence/native/linux/libmail_intelligence.so}
      INTELLIGENCE_PLUGIN_TIMEOUT_MS: ${INTELLIGENCE_PLUGIN_TIMEOUT_MS:-2000}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    profiles:
      - app
