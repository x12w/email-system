services:
  mysql:
    image: mysql:8.4
    container_name: email-system-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-email_system}
      MYSQL_USER: ${MYSQL_USER:-email_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-email_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

  redis:
    image: redis:7.2
    container_name: email-system-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:latest
    container_name: email-system-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/uploads:/data
    command: server /data --console-address ":9001"

  mailpit:
    image: axllent/mailpit:latest
    container_name: email-system-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - ./data/mailpit:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  nginx:
    image: nginx:1.27-alpine
    container_name: email-system-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    profiles:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: email-system-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - minio
      - mailpit
    profiles:
      - app
